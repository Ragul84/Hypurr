# Generate the Xcode project with: xcodegen generate --spec apps/project.yml
name: Hypurr
options:
  bundleIdPrefix: com.ragul84
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.5.6
  HypurrKit:
    path: ../kit
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0
settings:
  base:
    MARKETING_VERSION: 2.4.0
    CURRENT_PROJECT_VERSION: 24
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    # Which Hypurr cloud a build talks to: shared/Config/<env>.plist becomes AccountConfig.plist.
    Debug:
      HYPURR_ENV: dev
    Release:
      HYPURR_ENV: main
targets:
  macOS:
    type: application
    platform: macOS
    sources:
      - path: shared
        excludes:
          - Config
      - path: macos
        excludes:
          - LaunchAgents
      # Registered with SMAppService.agent when Remote screen is turned on.
      - path: macos/LaunchAgents/com.ragul84.Hypurr.screen.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: Clerk
        product: ClerkKit
      - package: HypurrKit
        product: HypurrKit
      - package: HypurrKit
        product: HypurrUI
      - target: Screen
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
    settings:
      base:
        PRODUCT_NAME: Hypurr
        PRODUCT_BUNDLE_IDENTIFIER: com.ragul84.Hypurr
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: macos/Resources/Info.plist
        # Sparkle compares this version; iOS retains its separate upload counter.
        CURRENT_PROJECT_VERSION: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleDisplayName: Hypurr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Black / white instead of the system blue wherever macOS draws the app's accent.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    postBuildScripts:
      - name: Hypurr environment
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          # Debug builds use dev (dev-api.hypurr.dev), Release builds use main (api.hypurr.dev).
          cp "$SRCROOT/shared/Config/$HYPURR_ENV.plist" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AccountConfig.plist"
      - name: Embed hypurr-host
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          # Builds the Rust host and ships it inside Hypurr.app/Contents/MacOS.
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v cargo >/dev/null; then
            echo "warning: cargo not found; Hypurr.app will look for hypurr-host on PATH instead"
            exit 0
          fi
          PROFILE=release
          [ "$CONFIGURATION" = "Debug" ] && PROFILE=debug
          FLAGS=""
          [ "$PROFILE" = "release" ] && FLAGS="--release"
          if [ "$PROFILE" = "release" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin >/dev/null 2>&1 || true
            cargo build --release --manifest-path "$SRCROOT/../host/Cargo.toml" --target aarch64-apple-darwin &&
            cargo build --release --manifest-path "$SRCROOT/../host/Cargo.toml" --target x86_64-apple-darwin &&
            lipo -create -output "$SRCROOT/../host/target/hypurr-host-universal" \
              "$SRCROOT/../host/target/aarch64-apple-darwin/release/hypurr-host" \
              "$SRCROOT/../host/target/x86_64-apple-darwin/release/hypurr-host" &&
            BIN="$SRCROOT/../host/target/hypurr-host-universal" ||
            { cargo build --release --manifest-path "$SRCROOT/../host/Cargo.toml" && BIN="$SRCROOT/../host/target/release/hypurr-host"; }
          else
            cargo build --manifest-path "$SRCROOT/../host/Cargo.toml" && BIN="$SRCROOT/../host/target/debug/hypurr-host"
          fi
          [ -n "$BIN" ] || { echo "error: building hypurr-host failed"; exit 1; }
          DEST="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/hypurr-host"
          cp "$BIN" "$DEST"
          if [ -n "$EXPANDED_CODE_SIGN_IDENTITY" ] && [ "$CODE_SIGNING_ALLOWED" != "NO" ]; then
            codesign --force --options runtime --timestamp=none --sign "$EXPANDED_CODE_SIGN_IDENTITY" "$DEST"
          fi
  # Screen capture, input and WebRTC for Remote screen. A separate signed bundle so
  # macOS's Screen Recording / Accessibility grants belong to it (see host/src/screen.rs).
  Screen:
    type: application
    platform: macOS
    sources:
      - screen-macos
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_NAME: HypurrScreen
        PRODUCT_BUNDLE_IDENTIFIER: com.ragul84.Hypurr.screen
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hypurr Screen
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        SKIP_INSTALL: YES
  iOS:
    type: application
    platform: iOS
    sources:
      - path: shared
        excludes:
          - Config
      - path: ios
        excludes:
          - Widgets
          - NotificationService
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: HypurrKit
        product: HypurrKit
      - package: HypurrKit
        product: HypurrUI
      - target: Widgets
        embed: true
      - target: NotificationService
        embed: true
    postBuildScripts:
      - name: Hypurr environment
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          # Debug builds use dev (dev-api.hypurr.dev), Release builds use main (api.hypurr.dev).
          cp "$SRCROOT/shared/Config/$HYPURR_ENV.plist" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/AccountConfig.plist"
    settings:
      base:
        PRODUCT_NAME: Hypurr
        PRODUCT_BUNDLE_IDENTIFIER: com.ragul84.Hypurr.ios
        INFOPLIST_FILE: ios/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ios/Resources/iOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Hypurr
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan the pairing code shown on your computer.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Talk to your bots in a voice call.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Your words are transcribed on this iPhone and sent to your bot as a message.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Hypurr connects to the computer running your bots on your local network.
        # Portrait everywhere except the screen viewer (AppDelegate + OrientationLock).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - ios/Widgets
    dependencies:
      - package: HypurrKit
        product: HypurrKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: HypurrWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.ragul84.Hypurr.ios.LiveActivity
        INFOPLIST_FILE: ios/Widgets/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ios/Widgets/Resources/Widgets.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Hypurr
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  # Opens end-to-end sealed alert text (spec §6.7) with this account's push key from the shared Keychain.
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - ios/NotificationService
    dependencies:
      - package: HypurrKit
        product: HypurrKit
    settings:
      base:
        PRODUCT_NAME: HypurrNotificationService
        PRODUCT_BUNDLE_IDENTIFIER: com.ragul84.Hypurr.ios.NotificationService
        INFOPLIST_FILE: ios/NotificationService/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ios/NotificationService/NotificationService.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Hypurr
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
