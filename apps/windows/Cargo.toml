[package]
name = "hypurr-desktop"
version = "0.1.0"
edition = "2024"
description = "Hypurr for Windows: runs the host in the background, pairs your phone with a QR code"
license = "MIT"

[[bin]]
name = "hypurr"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = true
strip = true
