name = "hypurr-cloud"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# main: production at hypurr.mindgains.ai (a Custom Domain on the mindgains.ai zone; see DEPLOY.md).
# relay.mindgains.ai: the same Worker, the address hosts and phones use for the encrypted relay
# ("Connect from anywhere"). It only ever forwards ciphertext.
routes = [{ pattern = "hypurr.mindgains.ai", custom_domain = true }, { pattern = "relay.mindgains.ai", custom_domain = true }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ComputerRelay"]

[vars]
# Accounts (Clerk) aren't set up yet; the gateway's trial keys and RevenueCat don't need them.
CLERK_ISSUER = "https://clerk.hypurr.dev"
GATEWAY_PUBLIC_URL = "https://hypurr.mindgains.ai"
# Secrets (wrangler secret put, never here): UPSTREAM_OPENROUTER_API_KEY, REVENUECAT_WEBHOOK_AUTH.

[[d1_databases]]
binding = "DB"
database_name = "hypurr"
database_id = "c799f739-7d92-47c5-b7f3-eb8e1872efef"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "RELAY"
class_name = "ComputerRelay"

# New computers per IP (POST /v1/host/register).
[[ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Credential issuance per account; separate from registration limits.
[[ratelimits]]
name = "TURN_LIMITER"
namespace_id = "1011"
simple = { limit = 12, period = 60 }

# Public routine webhook deliveries per sender IP and hook (POST /v1/hooks/...).
[[ratelimits]]
name = "HOOK_LIMITER"
namespace_id = "1021"
simple = { limit = 60, period = 60 }

# Gateway chat requests per key (all isolates); the D1 caps in gateway/config.ts are the daily limits.
[[ratelimits]]
name = "GATEWAY_LIMITER"
namespace_id = "1031"
simple = { limit = 20, period = 60 }

# Relay socket opens (GET /v1/relay/*) per computer or device IP; the DO also caps messages and bytes.
[[ratelimits]]
name = "RELAY_LIMITER"
namespace_id = "1041"
simple = { limit = 60, period = 60 }

[triggers]
crons = ["*/15 * * * *"]

# dev: a test environment at hypurr-dev.mindgains.ai (Clerk development instance).
[env.dev]
name = "hypurr-cloud-dev"
routes = [{ pattern = "hypurr-dev.mindgains.ai", custom_domain = true }]
vars = { CLERK_ISSUER = "https://your-dev-instance.clerk.accounts.dev" }
d1_databases = [{ binding = "DB", database_name = "hypurr-dev", database_id = "REPLACE_WITH_YOUR_DEV_D1_DATABASE_ID", migrations_dir = "migrations" }]
durable_objects.bindings = [{ name = "RELAY", class_name = "ComputerRelay" }]
ratelimits = [{ name = "REGISTER_LIMITER", namespace_id = "1002", simple = { limit = 10, period = 60 } }, { name = "TURN_LIMITER", namespace_id = "1012", simple = { limit = 12, period = 60 } }, { name = "HOOK_LIMITER", namespace_id = "1022", simple = { limit = 60, period = 60 } }, { name = "GATEWAY_LIMITER", namespace_id = "1032", simple = { limit = 20, period = 60 } }, { name = "RELAY_LIMITER", namespace_id = "1042", simple = { limit = 60, period = 60 } }]
triggers = { crons = ["*/15 * * * *"] }

# local: wrangler dev / e2e with a local D1; CLERK_JWT_KEY is injected by the test (--var).
[env.local]
name = "hypurr-cloud-local"
routes = []
vars = { CLERK_ISSUER = "https://clerk.test.local" }
d1_databases = [{ binding = "DB", database_name = "hypurr-local", database_id = "local", migrations_dir = "migrations" }]
durable_objects.bindings = [{ name = "RELAY", class_name = "ComputerRelay" }]
ratelimits = [{ name = "REGISTER_LIMITER", namespace_id = "1003", simple = { limit = 10, period = 60 } }, { name = "TURN_LIMITER", namespace_id = "1013", simple = { limit = 12, period = 60 } }, { name = "HOOK_LIMITER", namespace_id = "1023", simple = { limit = 60, period = 60 } }, { name = "GATEWAY_LIMITER", namespace_id = "1033", simple = { limit = 20, period = 60 } }, { name = "RELAY_LIMITER", namespace_id = "1043", simple = { limit = 60, period = 60 } }]
