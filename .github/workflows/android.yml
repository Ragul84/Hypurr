name: hypurr-android

on:
  push:
    branches: [main, v2]
    paths: ["apps/android/**", "docs/reference/fixtures/remote-relay-vectors.json", ".github/workflows/android.yml"]
  pull_request:
    paths: ["apps/android/**", "docs/reference/fixtures/remote-relay-vectors.json", ".github/workflows/android.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: hypurr-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: apps/android/app/build/reports/tests/
          if-no-files-found: ignore
