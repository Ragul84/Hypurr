name: HypurrKit

on:
  push:
    branches: [main, v2]
    paths: ["kit/**", "docs/reference/fixtures/remote-relay-vectors.json", "docs/reference/fixtures/task-wire.json", "docs/reference/fixtures/work-wire.json", "docs/reference/fixtures/admin-wire.json", ".github/workflows/kit.yml"]
  pull_request:
    paths: ["kit/**", "docs/reference/fixtures/remote-relay-vectors.json", "docs/reference/fixtures/task-wire.json", "docs/reference/fixtures/work-wire.json", "docs/reference/fixtures/admin-wire.json"]

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift build
      - run: swift test
