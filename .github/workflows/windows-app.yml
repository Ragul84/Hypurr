name: windows-app

on:
  push:
    branches: [main]
    paths: ["apps/windows/**", "host/**", "packaging/windows/**", ".github/workflows/windows-app.yml"]
  pull_request:
    paths: ["apps/windows/**", "host/**", "packaging/windows/**", ".github/workflows/windows-app.yml"]
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libxkbcommon-x11-0 libgl1-mesa-dri libegl1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build
      - name: Screenshots (QR + status, light + dark)
        run: |
          mkdir -p shots
          for s in qr status public; do for t in light dark; do
            LIBGL_ALWAYS_SOFTWARE=1 timeout 60 xvfb-run -a -s "-screen 0 1280x1024x24" target/debug/hypurr --demo $s --theme $t --screenshot shots/$s-$t.png
            test -s shots/$s-$t.png
          done; done
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app-screenshots
          path: apps/windows/shots

  installer:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    env:
      # SignPath (free OSS signing) runs only once these exist; see docs/release/windows-signing.md.
      SIGNPATH_ON: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY: ${{ vars.STORE_PUBLISHER_DISPLAY }}
    steps:
      - uses: actions/checkout@v4
      - name: Version (from apps/windows/Cargo.toml)
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path apps/windows/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $h = (Select-String -Path host/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($v -ne $h) { throw "apps/windows ($v) and host ($h) versions differ" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/windows
            host
      - name: Lint + test the app
        working-directory: apps/windows
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build app + host (release)
        run: |
          cargo build --release --manifest-path apps/windows/Cargo.toml
          cargo build --release --manifest-path host/Cargo.toml
      - name: Stage files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item apps/windows/target/release/hypurr.exe dist/windows/
          Copy-Item host/target/release/hypurr-host.exe dist/windows/
          Copy-Item LICENSE dist/windows/LICENSE.txt
          Copy-Item NOTICE dist/windows/NOTICE.txt
      - name: Check the app has no console window (GUI subsystem)
        shell: pwsh
        run: |
          $b = [IO.File]::ReadAllBytes("dist/windows/hypurr.exe")
          $pe = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $pe + 24 + 68)
          if ($sub -ne 2) { throw "expected IMAGE_SUBSYSTEM_WINDOWS_GUI (2), got $sub" }
      - name: Sign app + host (skipped without a cert secret)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: packaging/windows/sign.ps1 dist/windows/hypurr.exe dist/windows/hypurr-host.exe
      - name: Upload app + host for SignPath
        id: unsigned-app
        if: env.SIGNPATH_ON == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: |
            dist/windows/hypurr.exe
            dist/windows/hypurr-host.exe
      - name: Sign app + host with SignPath
        if: env.SIGNPATH_ON == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'hypurr' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_CONFIG || 'app' }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed-app
      - name: Use the SignPath-signed app + host
        if: env.SIGNPATH_ON == 'true'
        shell: pwsh
        run: Copy-Item dist/signed-app/*.exe dist/windows/ -Force
      - name: Build installer (Inno Setup, per-user)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} "/DSrcDir=$PWD\dist\windows" "/O$PWD\dist" packaging\windows\hypurr.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - name: Sign installer (skipped without a cert secret)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: packaging/windows/sign.ps1 (Get-ChildItem dist\HypurrSetup-*.exe | Select -First 1).FullName
      - name: Upload installer for SignPath
        id: unsigned-setup
        if: env.SIGNPATH_ON == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/HypurrSetup-*.exe
      - name: Sign installer with SignPath
        if: env.SIGNPATH_ON == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'hypurr' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIG || 'installer' }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed-setup
      - name: Use the SignPath-signed installer
        if: env.SIGNPATH_ON == 'true'
        shell: pwsh
        run: Copy-Item dist/signed-setup/HypurrSetup-*.exe dist/ -Force
      - name: Installer name matches the version
        shell: pwsh
        run: if (-not (Test-Path "dist/HypurrSetup-${{ steps.version.outputs.version }}.exe")) { throw "expected dist/HypurrSetup-${{ steps.version.outputs.version }}.exe" }
      - name: Silent per-user install + uninstall (no admin)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\HypurrSetup-*.exe | Select -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Hypurr"
          foreach ($f in 'hypurr.exe','hypurr-host.exe','unins000.exe') { if (-not (Test-Path "$dir\$f")) { throw "missing $f" } }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Hypurr.lnk")) { throw "no Start menu shortcut" }
          if (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -Name Hypurr -ErrorAction SilentlyContinue) { throw "installer must not enable Start with Windows" }
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep 3
          if (Test-Path "$dir\hypurr.exe") { throw "uninstall left files" }
      - uses: actions/upload-artifact@v4
        with:
          name: hypurr-windows-installer
          path: dist/HypurrSetup-*.exe
      - name: Build MSIX for the Microsoft Store (unsigned; the Store signs it)
        shell: pwsh
        run: packaging/windows/msix/build.ps1 -Version ${{ steps.version.outputs.version }} -SrcDir dist\windows -Out dist\Hypurr-${{ steps.version.outputs.version }}.msix
      - uses: actions/upload-artifact@v4
        with:
          name: hypurr-windows-msix
          path: dist/Hypurr-*.msix
