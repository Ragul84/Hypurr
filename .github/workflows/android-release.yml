name: android-release

# Builds the signed Play bundle (AAB) with the upload key from repo secrets:
#   ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD
# Optional: REVENUECAT_ANDROID_KEY. Without the keystore secret the bundle is built unsigned.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["apps/android/app/build.gradle.kts", "apps/android/app/proguard-rules.pro", ".github/workflows/android-release.yml"]

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "HYPURR_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No upload keystore secret; building an unsigned bundle."
          fi
      - name: Build release AAB + APK (R8)
        env:
          HYPURR_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          HYPURR_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          HYPURR_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Verify signature
        if: env.HYPURR_UPLOAD_STORE_FILE != ''
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Smoke test the minified (R8) release APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: apps/android
          script: bash scripts/release-smoke.sh app/build/outputs/apk/release/app-release.apk
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: hypurr-release-aab
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
            apps/android/release-smoke.png
          if-no-files-found: warn
