name: Release macOS

on:
  # Tag-triggered publishing is disabled until Hypurr has its own Apple, Sparkle
  # and tap secrets. Restore `push: tags: ["v*"]` when releases are ready.
  # A dry run from any branch: builds, signs and notarizes, but publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION=${GITHUB_REF_NAME#v}
          else VERSION=$(awk '/MARKETING_VERSION:/ {print $2; exit}' apps/project.yml); fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Apple certificate and provisioning profile
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_FILE=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_FILE=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"

          security import "$CERT_FILE" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_FILE"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"

          security list-keychain -d user -s "$KEYCHAIN_FILE"

      - name: Metal toolchain
        # SwiftTerm (setup terminals) ships a Metal shader.
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build
        run: |
          xcodebuild build \
            -project apps/Hypurr.xcodeproj \
            -scheme macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/derived \
            -quiet \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=${{ env.VERSION }} \
            CURRENT_PROJECT_VERSION=${{ env.VERSION }}

      - name: Sign app with Developer ID
        run: |
          APP_PATH=$(find build/derived -name "Hypurr.app" -path "*/Release/*" | head -1)
          # Sign-in and the cloud relay read their settings from here.
          test -f "$APP_PATH/Contents/Resources/AccountConfig.plist" || { echo "AccountConfig.plist missing"; exit 1; }
          sign() { codesign --force --options runtime --timestamp --preserve-metadata=entitlements --sign "Developer ID Application" "$1"; }
          # Sparkle's XPC services and updater must share our signing identity.
          # Preserve the framework helpers' sandbox entitlements while resigning.
          find "$APP_PATH" -type f -name Autoupdate -print0 | while IFS= read -r -d '' f; do sign "$f"; done
          sign "$APP_PATH/Contents/MacOS/hypurr-host"
          find "$APP_PATH" -depth \( -name '*.xpc' -o -name '*.app' -o -name '*.framework' \) -print0 |
            while IFS= read -r -d '' f; do sign "$f"; done
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Hypurr.app"

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/Hypurr.app" \
            "$RUNNER_TEMP/hypurr-submit.zip"

          xcrun notarytool submit "$RUNNER_TEMP/hypurr-submit.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

          xcrun stapler staple "$RUNNER_TEMP/Hypurr.app"

      - name: Create DMG
        run: |
          DMG_DIR=$RUNNER_TEMP/dmg_staging
          mkdir -p "$DMG_DIR"
          cp -R "$RUNNER_TEMP/Hypurr.app" "$DMG_DIR/"
          brew install create-dmg
          swift packaging/dmg/background.swift "$RUNNER_TEMP/dmg-background.tiff"
          create-dmg --volname Hypurr --background "$RUNNER_TEMP/dmg-background.tiff" \
            --window-size 660 400 --icon-size 128 --text-size 13 \
            --icon Hypurr.app 170 200 --hide-extension Hypurr.app \
            --app-drop-link 490 200 --no-internet-enable \
            build/hypurr-macos.dmg "$DMG_DIR"
          spctl --assess --type execute -v "$RUNNER_TEMP/Hypurr.app"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'SPARKLE_PRIVATE_KEY is required'; exit 1; }
          SPARKLE_BIN=build/derived/SourcePackages/artifacts/sparkle/Sparkle/bin
          test -x "$SPARKLE_BIN/generate_appcast"
          mkdir -p build/updates
          cp build/hypurr-macos.dmg build/updates/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file - --maximum-deltas 0 \
            --download-url-prefix "https://github.com/Ragul84/Hypurr/releases/download/v${VERSION}/" \
            --link https://www.hypurr.dev/ \
            -o build/appcast.xml build/updates
          python3 -m venv "$RUNNER_TEMP/update-verification"
          "$RUNNER_TEMP/update-verification/bin/pip" install 'cryptography>=44,<47'
          "$RUNNER_TEMP/update-verification/bin/python" packaging/updates/verify-appcast.py \
            build/appcast.xml "$RUNNER_TEMP/Hypurr.app" build/hypurr-macos.dmg

      - name: Keep the dry run's DMG
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: hypurr-macos
          path: |
            build/hypurr-macos.dmg
            build/appcast.xml

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # The host workflow may have created this release already (same tag).
          (cd build && shasum -a 256 hypurr-macos.dmg > hypurr-macos.dmg.sha256)
          gh release create ${{ github.ref_name }} \
            build/hypurr-macos.dmg build/hypurr-macos.dmg.sha256 build/appcast.xml \
            --title "Hypurr ${{ github.ref_name }}" \
            --generate-notes \
          || gh release upload ${{ github.ref_name }} build/hypurr-macos.dmg build/hypurr-macos.dmg.sha256 build/appcast.xml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SHA=$(shasum -a 256 build/hypurr-macos.dmg | awk '{print $1}')
          git clone https://x-access-token:${{ secrets.TAP_TOKEN }}@github.com/Ragul84/homebrew-hypurr.git tap
          mkdir -p tap/Casks
          sed -e "s/^  version .*/  version \"${{ env.VERSION }}\"/" -e "s/REPLACE_WITH_SHA256/$SHA/" \
              packaging/homebrew/hypurr.rb > tap/Casks/hypurr.rb
          cp packaging/homebrew/README.md tap/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Hypurr to ${{ env.VERSION }}" || exit 0
          git push
