name: Submit iOS

# Xcode Cloud archives the iOS app on the same v* tag and uploads it to TestFlight;
# this waits for that build and submits it for App Review.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to submit, e.g. 2.3.0"
        required: true

concurrency:
  group: ios-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyjwt cryptography
      - name: Submit for review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          # A tag run waits for the build Xcode Cloud starts now, not an older upload.
          [[ "$GITHUB_EVENT_NAME" == push ]] && export SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 tools/asc-submit.py "${VERSION#v}"
