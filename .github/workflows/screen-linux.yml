name: Linux screen helper

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths: ["apps/screen-linux/**", ".github/workflows/screen-linux.yml"]
  pull_request:
    paths: ["apps/screen-linux/**", ".github/workflows/screen-linux.yml"]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/screen-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install GStreamer development packages
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends libgstreamer-plugins-base1.0-dev libgstreamer-plugins-bad1.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/screen-linux
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
