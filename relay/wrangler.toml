name = "hypurr-relay"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# push.mindgains.ai: what the Android app registers with and hosts push through (host -> here -> FCM).
routes = [{ pattern = "push.mindgains.ai", custom_domain = true }]

# Abuse limits per IP: token registrations, and host pushes (a host batches all its phones in one call).
[[ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "PUSH_LIMITER"
namespace_id = "2002"
simple = { limit = 120, period = 60 }
